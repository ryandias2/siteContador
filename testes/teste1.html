<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulação Evento</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    .special-message {
      font-size: 2rem;
      margin-top: 20px;
      display: none;
      animation: glow 1s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px yellow; }
      to   { text-shadow: 0 0 20px red; }
    }
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: fall linear forwards;
      z-index: 10;
    }
    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <h1>🎉 Simulação do Evento do Dia 19 🎉</h1>
  <button onclick="simulateEvent()">Simular Evento</button>
  <div class="special-message" id="specialMessage"></div>

  <script>
    let confettiInterval;

    function createConfetti() {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");
      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.backgroundColor =
        ["red","yellow","blue","pink","purple","orange","green"][Math.floor(Math.random()*7)];
      confetti.style.animationDuration = (Math.random()*3+2) + "s";
      confetti.style.width = confetti.style.height = (Math.random()*8+5) + "px";
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 5000);
    }

    function simulateEvent() {
      const msg = document.getElementById("specialMessage");
      msg.innerHTML = "🎊 Feliz nosso dia especial (19)! 🎊";
      msg.style.display = "block";

      // Inicia confetes a cada 200ms
      confettiInterval = setInterval(() => {
        for (let i = 0; i < 5; i++) createConfetti();
      }, 200);

      // Para depois de 5 minutos (300000ms)
      setTimeout(() => {
        clearInterval(confettiInterval);
        msg.style.display = "none";
      }, 300000);
    }
  </script>
</body>
</html>
